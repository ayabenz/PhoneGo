name: Build Release APK

on:
  push:
    branches:
      - fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK
      run: |
        echo "Building APK..."
        cd android-app
        echo "Current directory: $(pwd)"
        ls -la build.sh
        ./build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: android-app/build/app-debug.apk
        retention-days: 5