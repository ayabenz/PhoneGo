# Build and upload release APK on push to fix branch
name: Build Release APK

on:
  push:
    branches:
      - fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          build-tools: 35.0.0
      - name: Build APK
        run: |
          cd android-app
          echo "Building APK from $(pwd)"
          ./build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app-debug.apk
          retention-days: 5
