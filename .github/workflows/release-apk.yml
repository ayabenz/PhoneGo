name: Build Release APK

on:
  push:
    branches:
      - fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --install "build-tools;35.0.0" "platforms;android-35"

          yes | sdkmanager --licenses || true

          mkdir -p /home/runner/Library/Android
          ln -s "$ANDROID_HOME" /home/runner/Library/Android/sdk

      - name: Check Android SDK
        run: |
          ls -la /home/runner/Library/Android/sdk/build-tools/35.0.0/
          test -f /home/runner/Library/Android/sdk/build-tools/35.0.0/aapt2

      - name: Build APK
        working-directory: android-app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-app/build/app-debug.apk
          if-no-files-found: error
          retention-days: 5
