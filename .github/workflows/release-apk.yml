
name: Android APK Build

on:
  push:
    branches:
      - fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Verify existing helper JAR
      - name: Verify helper JAR
        run: |
          ASSET="android-app/app/src/main/assets/pa-helper.jar"

          if [ ! -f "$ASSET" ]; then
            echo "::error::pa-helper.jar not found: $ASSET"
            exit 1
          fi

          echo "Helper JAR found:"
          ls -lh "$ASSET"

      # Sync Python sources
      - name: Sync Python sources
        working-directory: android-app
        run: bash sync-python.sh

      # Sync maps (optional)
      - name: Sync maps
        working-directory: android-app
        run: |
          MAP_DIR="../phoneagent/maps"

          if [ -f "$MAP_DIR/k90_settings_inapp.yaml" ] && \
             [ -f "$MAP_DIR/k90_clock_inapp.yaml" ]; then
            bash sync-maps.sh
          else
            echo "::warning::Prebuilt maps not found. Skipping map synchronization."
            mkdir -p app/src/main/assets/maps
          fi

      # Build APK
      - name: Build Debug APK
        run: |
          gradle -p android-app :app:assembleDebug --no-daemon

      # Verify APK
      - name: Verify APK
        run: |
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phoneagent-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
