name: Build Release APK

on:
  push:
    branches:
      - fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 35.0.0

    - name: Build APK (debug mode as release target)
      run: |
        cd android-app
        ./build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: android-app/build/app-debug.apk
        retention-days: 5
