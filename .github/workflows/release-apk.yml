name: Build Release APK

on:
  push:
    branches:
      - fix

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK (with SDK fallback)
      run: |
        echo "Building APK..."
        export SDK_PATH=$HOME/Library/Android/sdk:$HOME/.cache/actions/android-sdk
        [ -d "$SDK_PATH" ] && echo "Found SDK" || echo "SDK not available (will use defaults)"
        ./build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release.apk
        path: build/app-debug.apk
        retention-days: 5