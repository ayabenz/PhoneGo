common_tasks:
- Search for restaurants and read reviews
- Book hotels and travel accommodations
- Order food delivery
- Browse and purchase local deals and coupons
- Check in at local businesses
- View maps and get directions
- Manage profile and view order history
- Upload photos and write reviews
- Use utility tools like currency exchange and menu translation
- Hail rides via Meituan integration
known_limitations:
- Some features like ride-hailing require additional authorization
- Search and filtering options may vary across categories
- Emoji keyboard appears in specific input contexts only
- Bottom navigation tabs may change depending on screen context
